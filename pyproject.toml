[project]
name = "rootwire"
version = "5.0.0"
description = "RootWire: a network traffic monitor that decodes raw Ethernet frames"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "EONRaider", email = "livewire_voodoo@protonmail.com" }]
requires-python = ">=3.12"
keywords = ["sniffer", "networking", "packets", "monitoring", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["netprotocols>=1.3,<2"]

[project.scripts]
rootwire = "rootwire.cli:main"

[project.urls]
Homepage = "https://github.com/EONRaider/RootWire"
Repository = "https://github.com/EONRaider/RootWire"
Changelog = "https://github.com/EONRaider/RootWire/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootwire"]

[tool.ruff]
line-length = 80
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["rootwire"]

[tool.coverage.report]
show_missing = true
