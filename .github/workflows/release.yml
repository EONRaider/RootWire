name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Run the full QA ladder against the tagged commit before anything is
  # uploaded. A tag push matches neither of ci.yml's own triggers (push
  # to master, pull_request), so without this job a release ran no
  # checks at all, and a published version can only be yanked, never
  # replaced.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      # The QA ladder cannot catch a mistagged release: every check
      # passes because the code is fine and only the tag is wrong. Read
      # the version back out of the artifact about to be uploaded,
      # rather than re-parsing pyproject.toml, so this compares against
      # what PyPI will actually receive.
      - name: Verify the tag matches the version being published
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(uv run --isolated --no-project --with dist/*.whl \
            python -c \
            "from importlib.metadata import version; print(version('rootwire'))")
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} would publish version ${built}."
            echo "The tag and the packaged version must agree." >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches packaged version ${built}."
      - run: uv publish --trusted-publishing always
